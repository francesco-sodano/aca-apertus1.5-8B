[project]
name = "apertus-local-frontend"
version = "1.5.0"
description = "Azure-independent local Apertus frontend"
requires-python = ">=3.12,<3.14"
dependencies = [
    "av>=16,<20",
    "chainlit==2.12.0",
    "httpx>=0.28.1,<1",
    "jsonschema>=4.26.0,<5",
    "opentelemetry-api>=1.45.2,<2",
    "pillow>=12,<14",
    "tzdata>=2026.6",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0,<10",
    "pytest-asyncio>=1.4.1.post1,<2",
]

[[tool.uv.index]]
name = "pypi-mirror"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = [".."]
testpaths = ["tests"]
