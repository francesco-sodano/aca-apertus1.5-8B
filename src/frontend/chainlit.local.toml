[project]
enable_telemetry = false
session_timeout = 3600
cache = false
persist_user_env = false
mask_user_env = true
user_env = []
transports = ["websocket"]

[features]
unsafe_allow_html = false
latex = false
allow_thread_sharing = false

[features.spontaneous_file_upload]
enabled = true
accept = [
  "image/png", "image/jpeg", "image/webp",
  "audio/wav", "audio/x-wav", "audio/mpeg", "audio/mp4",
  "audio/ogg", "audio/webm", "audio/flac",
]
max_files = 2
max_size_mb = 20

[features.audio]
enabled = false
sample_rate = 24000

[features.mcp]
enabled = false

[UI]
name = "Apertus 1.5 - Local"
description = "Private local text, image and audio inference"
default_theme = "light"
cot = "hidden"
confirm_new_chat = true
custom_build = "./ui"
custom_meta_url = "http://localhost:8080"
custom_meta_image_url = "/favicon"

[meta]
generated_by = "2.12.0"
