[project]
name = "apertus-frontend"
version = "1.5.0"
description = "Grounded Chainlit frontend for Apertus 1.5 on Azure Container Apps"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.14"
dependencies = [
    "azure-identity>=1.27.0,<2",
    "azure-monitor-opentelemetry>=1.8.11,<2",
    "chainlit==2.12.0",
    "httpx>=0.28.1,<1",
    "jsonschema>=4.26.0,<5",
    "openai>=3.42.1,<4",
    "opentelemetry-api>=1.45.2,<2",
    "tzdata>=2026.6",
]

[build-system]
requires = ["setuptools>=84.2.1,<85"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["apertus_frontend"]
py-modules = ["app", "grounding_evaluation", "safety_evaluation"]

[dependency-groups]
dev = [
    "httpx2>=2.16.0,<3",
    "opentelemetry-sdk>=1.45.2,<2",
    "pytest>=9.2.0,<10",
    "pytest-asyncio>=1.4.1.post1,<2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]