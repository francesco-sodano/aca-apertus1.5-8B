[project]
name = "apertus-frontend"
version = "1.5.0"
description = "Grounded Chainlit frontend for Apertus 1.5 on Azure Container Apps"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.14"
dependencies = [
    "azure-identity>=1.25.0,<2",
    "azure-monitor-opentelemetry>=1.8.0,<2",
    "chainlit==2.11.1",
    "httpx>=0.28.1,<1",
    "openai>=2.0.0,<3",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["apertus_frontend"]
py-modules = ["app"]

[dependency-groups]
dev = [
    "pytest>=8.4.0,<10",
    "pytest-asyncio>=1.2.0,<2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]